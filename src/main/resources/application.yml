spring:
  datasource:
    url: jdbc:mysql://localhost:3306/mydb?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Seoul&characterEncoding=UTF-8
    username: admin
    password: 1111
  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        format_sql: true
    open-in-view: false
  security:
    user:
      name: admin
      password: 1111
  profiles:
    active: local
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    baseline-version: 1

logging:
  level:
    org.hibernate.SQL: debug
    org.hibernate.orm.jdbc.bind: trace

devtools:
  livereload:
    enabled: true
  restart:
    enabled: true
  thymeleaf:
    cache: false


server:
  port: 8080

jwt:
  secret: "change-this-to-a-very-long-random-secret-string"
  issuer: "influencer-app"
  access-token-validity-seconds : 3600
  refresh-token-validity-days: 14   # 기본 14일, 필요 시 바꿔도 됨

spring.mvc.throw-exception-if-no-handler-found: true
spring.web.resources.add-mappings: false


springdoc:
  swagger-ui:
    path: /swagger-ui
  api-docs:
    path: /v3/api-docs
  default-consumes-media-type: application/json
  default-produces-media-type: application/json

